<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إعلاني | مصمم الإعلان الفوري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --ink:#13221C; --muted:#5B6B64; --line:#D5DEDA;
  --accent:#0F5257; --accent-ink:#FFFFFF; --saffron:#F2A900; --chip:#E3EAE7;
  --display:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613; --surface:#16201C; --ink:#E7EFEB; --muted:#98A9A1; --line:#29372F;
    --accent:#4FB3A9; --accent-ink:#06201D; --chip:#1F2B26;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16201C; --ink:#E7EFEB; --muted:#98A9A1; --line:#29372F;
  --accent:#4FB3A9; --accent-ink:#06201D; --chip:#1F2B26;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 120px}
header.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
header.top h1{font-family:var(--display);font-weight:800;font-size:2rem;margin:0;letter-spacing:-.01em}
header.top p{margin:0;color:var(--muted);font-size:.95rem}
header.top{position:relative;padding-inline-end:64px}
.langbtn{position:absolute;top:0;inset-inline-end:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 16px;font-family:var(--display);font-weight:700;font-size:.9rem}
.langbtn:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.grid{display:grid;gap:20px}
@media (min-width:860px){
  .grid{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}
  .stage{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px}
.canvas-box{display:flex;justify-content:center;background:repeating-conic-gradient(var(--chip) 0 25%,transparent 0 50%) 0 0/18px 18px;border-radius:14px;padding:12px}
canvas#ad{display:block;width:100%;height:auto;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.canvas-box.story canvas#ad{width:auto;max-width:100%;max-height:68vh}
.formats{display:flex;gap:8px;margin-top:12px}
.formats .seg{flex:1}
details.shop,section.step{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
details.shop summary{cursor:pointer;font-family:var(--display);font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.shop summary::-webkit-details-marker{display:none}
details.shop summary .hint{font-family:var(--body);font-weight:400;color:var(--muted);font-size:.85rem}
.step h2{font-family:var(--display);font-weight:700;font-size:1.1rem;margin:0 0 12px;display:flex;gap:10px;align-items:center}
.step h2 .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.9rem}
label.f{display:block;font-size:.9rem;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=tel],input[type=number],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row>*,.grid>*{min-width:0}
input,textarea,select{min-width:0;max-width:100%}
.drop span{overflow-wrap:anywhere}
.filebtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:.9rem;cursor:pointer}
.filebtn:focus-within{outline:3px solid var(--saffron);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label,.seg label{display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border-radius:999px;background:var(--chip);border:1px solid transparent;cursor:pointer;font-size:.92rem;user-select:none}
.seg{display:flex}
.seg label{flex:1;border-radius:12px}
.chips input:checked+label,.seg input:checked+label{background:var(--accent);color:var(--accent-ink)}
.chips input:focus-visible+label,.seg input:focus-visible+label{outline:3px solid var(--saffron);outline-offset:2px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;cursor:pointer;color:var(--muted)}
.drop strong{color:var(--ink);font-family:var(--display);font-weight:700}
.drop.has{border-style:solid;flex-direction:row;justify-content:flex-start;text-align:start;padding:10px}
.drop img{width:64px;height:64px;object-fit:cover;border-radius:10px;display:none}
.drop.has img{display:block}
.toggle{display:flex;gap:10px;align-items:flex-start;margin-top:12px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent);margin-top:3px;flex:none}
.toggle small{display:block;color:var(--muted)}
.color-row{display:flex;gap:10px;align-items:center}
.color-row input[type=color]{width:52px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:4px}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-family:var(--display);font-weight:700}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--chip);color:var(--ink)}
.btn-ai{width:100%;background:var(--saffron);color:#231A00;margin-bottom:6px}
.btn:disabled{opacity:.6;cursor:progress}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,.drop:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.status{min-height:1.4em;font-size:.88rem;color:var(--muted);margin:4px 0 0}
.small{font-size:.85rem;color:var(--muted)}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;z-index:5}
.bar .btn{flex:1;max-width:320px}
.clr{position:relative}
.clr input{padding-inline-end:48px}
.clrbtn{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:var(--chip);color:var(--ink);font-size:20px;line-height:34px;padding:0}
.clrbtn:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.gallery{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.gallery:empty{display:none}
.gthumb{position:relative;width:72px;height:72px;border-radius:12px;overflow:hidden;border:3px solid transparent;padding:0;background:var(--chip)}
.gthumb.on{border-color:var(--accent)}
.gthumb img{width:100%;height:100%;object-fit:cover;display:block}
.gthumb .vb{position:absolute;inset-inline-start:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:.7rem;border-radius:6px;padding:1px 5px}
.gx{position:absolute;top:2px;inset-inline-end:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:14px;line-height:22px;padding:0}
.bar .btn{padding:13px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 data-i18n="title">إعلاني</h1>
    <p data-i18n="tag">صوّر منتجك، واطلع بإعلان جاهز للنشر خلال دقيقة.</p>
    <button type="button" class="langbtn" id="uiLang" aria-label="Change language">EN</button>
  </header>

  <div class="grid">
    <div class="stage">
      <div class="canvas-box" id="canvasBox"><canvas id="ad" width="1080" height="1080" aria-label="معاينة الإعلان" data-i18n-aria="aPreview"></canvas></div>
      <div class="formats seg" role="radiogroup" aria-label="المقاس" data-i18n-aria="aSize">
        <input type="radio" name="format" id="fmt-sq" value="square" checked><label for="fmt-sq" data-i18n="fmtSq">بوست مربع</label>
        <input type="radio" name="format" id="fmt-st" value="story"><label for="fmt-st" data-i18n="fmtSt">ستوري وحالة واتساب</label>
      </div>
    </div>

    <div>
      <details class="shop" id="shopBox">
        <summary><span data-i18n="shop">بيانات المحل</span> <span class="hint" id="shopHint" data-i18n="shopHint">تُحفظ على جهازك</span></summary>
        <label class="f" for="shopName" data-i18n="shopName">اسم المحل</label>
        <input type="text" id="shopName" placeholder="مثال: عطور اللبان" data-i18n-ph="phShop">
        <label class="f" for="shopPhone" data-i18n="shopPhone">رقم الواتساب</label>
        <input type="tel" id="shopPhone" inputmode="tel" placeholder="9xxxxxxx">
        <div class="row">
          <div>
            <label class="f" for="shopColor" data-i18n="shopColor">لون المحل</label>
            <div class="color-row"><input type="color" id="shopColor" value="#0F5257"><span class="small" data-i18n="colorHint">يُستخدم في الإعلانات العادية</span></div>
          </div>
          <div>
            <span class="f" style="display:block;font-size:.9rem;color:var(--muted);margin:10px 0 4px" data-i18n="logo">الشعار</span>
            <label class="filebtn" for="logoInput"><span aria-hidden="true">🖼️</span><span data-i18n="pickLogo">اختر الشعار</span></label>
            <input type="file" id="logoInput" accept="image/*" hidden>
          </div>
        </div>
        <button class="btn btn-ghost" id="clearLogo" type="button" style="margin-top:10px;padding:8px 14px" hidden data-i18n="clearLogo">إزالة الشعار</button>
      </details>

      <section class="step">
        <h2><span class="n">1</span><span data-i18n="s1">صورة المنتج</span></h2>
        <label class="drop" id="drop" tabindex="0">
          <img id="thumb" alt="">
          <span><strong id="dropTitle" data-i18n="dropT">أضف صور أو فيديو للمنتج</strong><br><span id="dropSub" data-i18n="dropS">تقدر تختار أكثر من صورة وفيديو. الصور على خلفية سادة تعطي أفضل نتيجة</span></span>
          <input type="file" id="photoInput" accept="image/*,video/*" multiple hidden>
        </label>
        <div class="gallery" id="gallery" aria-label="الصور والفيديوهات"></div>
        <label class="toggle"><input type="checkbox" id="removeBg" checked><span><span data-i18n="rmBg">إزالة الخلفية الفاتحة</span><small data-i18n="rmBgS">تعمل مع الصور على خلفية بيضاء أو لون واحد</small></span></label>
      </section>

      <section class="step">
        <h2><span class="n">2</span><span data-i18n="s2">تفاصيل المنتج</span></h2>
        <label class="f" for="product" data-i18n="product">اسم المنتج</label>
        <input type="text" id="product" placeholder="مثال: دهن عود كمبودي" data-i18n-ph="phProduct">
        <div class="row">
          <div><label class="f" for="price" data-i18n="price">السعر (ر.ع)</label><input type="text" id="price" inputmode="decimal" placeholder="12.500"></div>
          <div><label class="f" for="oldPrice" data-i18n="oldPrice">السعر قبل الخصم</label><input type="text" id="oldPrice" inputmode="decimal" placeholder="اختياري" data-i18n-ph="phOpt"></div>
        </div>
        <label class="f" for="note" data-i18n="note">ملاحظة للإعلان</label>
        <input type="text" id="note" placeholder="اختياري: توصيل مجاني، الكمية محدودة…" data-i18n-ph="phNote">
      </section>

      <section class="step">
        <h2><span class="n">3</span><span data-i18n="s3">المناسبة والشكل</span></h2>
        <div class="chips" role="radiogroup" aria-label="المناسبة" data-i18n-aria="occ" id="occasions"></div>
        <label class="f" data-i18n="layout">القالب</label>
        <div class="chips" role="radiogroup" aria-label="القالب" data-i18n-aria="layout" id="layouts"></div>
        <label class="f" data-i18n="adLang">لغة الإعلان</label>
        <div class="chips" role="radiogroup" aria-label="اللغة" data-i18n-aria="adLang" id="langs"></div>
      </section>

      <section class="step">
        <h2><span class="n">4</span><span data-i18n="s4">نص الإعلان</span></h2>
        <button class="btn btn-ai" id="aiBtn" type="button" hidden data-i18n="ai">اكتب النص بالذكاء الاصطناعي</button>
        <p class="status" id="aiStatus" aria-live="polite"></p>
        <label class="f" for="headline" data-i18n="headline">العنوان</label>
        <div class="clr"><input type="text" id="headline" placeholder="بدون عنوان" data-i18n-ph="phNoHead"><button type="button" class="clrbtn" data-clear="headline" aria-label="حذف العنوان" data-i18n-aria="aClrHead">×</button></div>
        <label class="f" for="sub" data-i18n="sub">السطر الثاني</label>
        <div class="clr"><input type="text" id="sub" placeholder="بدون سطر ثاني" data-i18n-ph="phNoSub"><button type="button" class="clrbtn" data-clear="sub" aria-label="حذف السطر الثاني" data-i18n-aria="aClrSub">×</button></div>
        <label class="f" for="cta" data-i18n="cta">زر الطلب</label>
        <input type="text" id="cta">
        <label class="f" for="caption" data-i18n="caption">نص البوست (للنسخ مع الصورة)</label>
        <textarea id="caption"></textarea>
      </section>
    </div>
  </div>
</div>

<div class="bar">
  <button class="btn btn-primary" id="saveBtn" type="button">حمّل الصورة</button>
  <button class="btn btn-primary" id="videoBtn" type="button" hidden>حمّل فيديو</button>
  <button class="btn btn-ghost" id="copyBtn" type="button" data-i18n="copyBtn">انسخ النص</button>
</div>
<div class="toast" id="toast" role="status"></div>

function toCanvas(img,max){

  c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c;
}
function removeLightBg(src){
  const w=src.width,h=src.height;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'); x.drawImage(src,0,0);
  let data; try{ data=x.getImageData(0,0,w,h);}catch(e){ return null; }
  const d=data.data;
  // reference color from border average
  let r=0,g=0,b=0,n=0;
  const samp=(i)=>{r+=d[i];g+=d[i+1];b+=d[i+2];n++;};
  for(let i=0;i<w;i+=4){ samp((i)*4); samp(((h-1)*w+i)*4); }
  for(let j=0;j<h;j+=4){ samp((j*w)*4); samp((j*w+w-1)*4); }
  r/=n;g/=n;b/=n;
  // check border uniformity
  let dev=0,m=0;
  for(let i=0;i<w;i+=8){ const k=i*4; dev+=Math.abs(d[k]-r)+Math.abs(d[k+1]-g)+Math.abs(d[k+2]-b); m++; }
  if(dev/m>70) return null;
  const tol=46*46*3, soft=tol*2.4;
  const dist=(k)=>{const dr=d[k]-r,dg=d[k+1]-g,db=d[k+2]-b;return dr*dr+dg*dg+db*db;};
  const seen=new Uint8Array(w*h), stack=new Int32Array(w*h); let sp=0;
  const push=(p)=>{ if(!seen[p]){ seen[p]=1; if(dist(p*4)<tol){ stack[sp++]=p; } else seen[p]=2; } };
  for(let i=0;i<w;i++){ push(i); push((h-1)*w+i); }
  for(let j=0;j<h;j++){ push(j*w); push(j*w+w-1); }
  while(sp){
    const p=stack[--sp]; d[p*4+3]=0;
    const px=p%w, py=(p/w)|0;
    if(px>0) push(p-1); if(px<w-1) push(p+1); if(py>0) push(p-w); if(py<h-1) push(p+w);
  }
  // soften edge pixels (seen=2 are border-adjacent non-bg)
  for(let p=0;p<w*h;p++){ if(seen[p]===2){ const dd=dist(p*4); if(dd<soft){ d[p*4+3]=Math.round(255*Math.min(1,(dd-tol)/(soft-tol)+.25)); } } }
  x.putImageData(data,0,0);
  // crop to content
  let minX=w,minY=h,maxX=-1,maxY=-1;
  for(let y=0;y<h;y+=2) for(let xx=0;xx<w;xx+=2){ if(d[(y*w+xx)*4+3]>20){ if(xx<minX)minX=xx; if(xx>maxX)maxX=xx; if(y<minY)minY=y; if(y>maxY)maxY=y; } }
  if(maxX<0) return null;
  const removed = 1-((maxX-minX)*(maxY-minY))/(w*h);
  let cleared=0; for(let p=0;p<w*h;p+=7) if(d[p*4+3]===0) cleared++;
  if(cleared/(w*h/7)<.08) return null; // nothing meaningful removed
  const cw=maxX-minX+2, ch=maxY-minY+2;
  const o=document.createElement('canvas'); o.width=cw; o.height=ch;
  o.getContext('2d').drawImage(c,minX,minY,cw,ch,0,0,cw,ch);
  void removed; return o;
}
function toJpegBlob(src,max){

  const map={
    normal:{bg:brand,bg2:mix(brand,'#000000',.4),accent:'#F2A900'},
    sale:{bg:'#D7263D',bg2:'#8F1426',accent:'#FFD23F'},
    ramadan:{bg:'#1F2457',bg2:'#0B0E2B',accent:'#E9B949'},
    eid:{bg:'#0F5257',bg2:'#062F33',accent:'#E9B949'},

    new:{bg:'#13221C',bg2:'#030806',accent:'#3DDC97'}

  const p={...map[state.occasion]};
  p.text = lum(p.bg)>.5?'#13221C':'#FFFFFF';

function layoutBold(c,W,H,d){
  const story=H>W, pad=story?80:56, p=palette(false), rtl=d.rtl;
  c.fillStyle='#FFFFFF'; c.fillRect(0,0,W,H);
  const g=c.createLinearGradient(0,0,W,H); g.addColorStop(0,p.bg); g.addColorStop(1,p.bg2); c.fillStyle=g;
  let pr, tr; // product rect, text rect
  c.beginPath();
  if(story){
    const s=Math.round(H*.52);
    c.moveTo(0,s+60); c.lineTo(W,s-60); c.lineTo(W,H); c.lineTo(0,H); c.closePath(); c.fill();
    pr={x:pad,y:pad,w:W-pad*2,h:s-pad-90}; tr={x:pad,y:s+60,w:W-pad*2,h:H-s-60-pad};
  } else {
    const half=W*.5;
    if(rtl){ c.moveTo(half+50,0); c.lineTo(W,0); c.lineTo(W,H); c.lineTo(half-50,H); }
    else { c.moveTo(0,0); c.lineTo(half+50,0); c.lineTo(half-50,H); c.lineTo(0,H); }
    c.closePath(); c.fill();
    pr = rtl? {x:pad,y:pad,w:half-pad-90,h:H-pad*2} : {x:half+90,y:pad,w:half-pad-90,h:H-pad*2};
    tr = rtl? {x:half+70,y:pad,w:half-70-pad,h:H-pad*2} : {x:pad,y:pad,w:half-70-pad,h:H-pad*2};

  if(state.occasion==='national'){ const sh=story?20:14; c.fillStyle='#FFFFFF'; c.fillRect(0,H-sh*3,W,sh); c.fillStyle='#00823D'; c.fillRect(0,H-sh,W,sh); }
  // header

  if(story){ py = header(c,pr.x,pr.x+pr.w,pr.y,'#13221C',d,96); if(py>pr.y) py+=30; }
  product(c,d,pr.x,py,pr.w,pr.h-(py-pr.y),'#13221C','rgba(0,0,0,.25)');
  // text column
  const sx = rtl? tr.x+tr.w : tr.x, al = rtl?'right':'left';
  let y=tr.y + (story?10:0);
  if(!story){ y = header(c,tr.x,tr.x+tr.w,y,p.text,d,80); if(y>tr.y) y+=34; }
  c.textAlign=al;
  const HF=fit(c,d.headline,tr.w,3,story?120:84,44,800,DISP);
  y=drawLines(c,HF,sx,y,1.18,p.text,800,DISP)+(story?20:14);
  if(d.sub){ c.textAlign=al; const SF=fit(c,d.sub,tr.w,story?2:3,story?50:36,26,500,BODY); y=drawLines(c,SF,sx,y,1.45,p.soft,500,BODY)+(story?30:22); }
  if(d.price){
    if(d.old){ c.textAlign=al; c.textBaseline='top'; c.font=`500 ${story?44:32}px ${BODY}`; c.fillStyle=rgba(p.text,.7); const t=`${d.old} ${d.cur}`; c.fillText(t,sx,y); const tw=c.measureText(t).width; const lh=story?44:32; c.fillRect(rtl?sx-tw:sx,y+lh*.55,tw,3); y+=lh*1.3; }
    const ps = story?130:96; c.textAlign=al; c.textBaseline='top'; c.fillStyle=p.accent;
    const t=`${d.price} ${d.cur}`; fitOne(c,t,tr.w,ps,40,800,DISP); c.fillText(t,sx,y);
    if(d.disc){ const tw=c.measureText(t).width; discountTag(c, rtl? sx-tw-ps*.9 : sx+tw+ps*.9, y+ps*.45, story?40:30, p, d); }
    y+=ps*1.2;
  }
  const ft=footerText(d), bottom=tr.y+tr.h-(state.occasion==='national'?40:0);
  let fy=bottom;
  if(ft){ c.textAlign=al; c.textBaseline='bottom'; c.fillStyle=p.soft; c.font=`500 ${story?40:30}px ${BODY}`; c.fillText(ft,sx,fy); fy-= story?70:52; }
  if(d.cta){ const h=story?100:76; const cy=Math.max(y, fy-h); if(cy+h<=bottom+4) pill(c,sx,cy,h,d.cta,p.accent,p.onAccent,rtl?'right':'left'); }
}

function loadVideo(file){

    v.onloadeddata=()=>res(v); v.onerror=()=>rej(new Error('bad video'));

  return c;
}

/* ---------- iPhone app (Capacitor): save & share through the iOS share sheet ---------- */
const Cap = window.Capacitor;
const isNative = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
const plug = n => isNative ? ((Cap.Plugins && Cap.Plugins[n]) || (Cap.registerPlugin ? Cap.registerPlugin(n) : null)) : null;
const FS = plug('Filesystem'), SH = plug('Share'), HP = plug('Haptics');
function blobToBase64(blob){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(blob); });
}
async function nativeShare(blob,name){
  if(!isNative||!FS||!SH) return false;
  try{
    const safe=(name||'ilani').replace(/[^\w؀-ۿ.\-]+/g,'-');
    const w=await FS.writeFile({path:safe,data:await blobToBase64(blob),directory:'CACHE'});
    if(HP) HP.impact({style:'LIGHT'}).catch(()=>{});
    await SH.share({title:'إعلاني',files:[w.uri],dialogTitle:'احفظ أو شارك الإعلان'});
  }catch(e){
    const msg=String((e&&e.message)||e||'');
    if(!/cancel/i.test(msg)) toast(L('tShare'));
  }
  return true;
}

const wait=ms=>new Promise(r=>setTimeout(r,ms));
let actx=null;
function pickMime(){
  const opts=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];
  if(!window.MediaRecorder) return null;
  for(const m of opts){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(_){} }
  return '';
}
$('#videoBtn').addEventListener('click',async()=>{
  if(state.recording||!state.media.length) return;
  const mime=pickMime();
  if(mime===null||!canvas.captureStream){ toast(L('tNoRec')); return; }
  // audio from video clips (WebAudio)
  let dest=null;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    await actx.resume();
    dest=actx.createMediaStreamDestination();
    state.media.forEach(m=>{ if(m.kind==='video'){ if(!m.srcNode) m.srcNode=actx.createMediaElementSource(m.el); try{m.srcNode.disconnect();}catch(_){} m.srcNode.connect(dest); }});
  }catch(_){ dest=null; }
  const stream=canvas.captureStream(30);
  if(dest) dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  let rec; try{ rec=new MediaRecorder(stream, mime?{mimeType:mime,videoBitsPerSecond:6000000}:undefined); }
  catch(_){ toast(L('tRecFail')); return; }
  const chunks=[]; rec.ondataavailable=ev=>{ if(ev.data&&ev.data.size) chunks.push(ev.data); };
  const done=new Promise(r=>rec.onstop=r);
  const prevCur=state.cur, btns=[$('#saveBtn'),$('#videoBtn'),$('#copyBtn')];
  btns.forEach(b=>b.disabled=true); state.recording=true;
  state.media.forEach(m=>{ if(m.kind==='video'){ m.el.pause(); m.el.loop=false; m.el.muted=!dest; }});
  state.cur=0; render(); rec.start(250);
  const t0=performance.now(); let total=0; const LIMIT=60000;
  try{
    for(let i=0;i<state.media.length&&total<LIMIT;i++){
      state.cur=i; const it=state.media[i];
      $('#videoBtn').textContent=L('recording')(i+1,state.media.length);
      if(it.kind==='image'){
        const dur=3000, s0=performance.now();
        while(performance.now()-s0<dur){ state.zoom=1+.06*((performance.now()-s0)/dur); await wait(30); }
        state.zoom=1;
      } else {
        const v=it.el; v.currentTime=0; await v.play().catch(()=>{});
        const cap=Math.min(15000,LIMIT-total), s0=performance.now();
        while(!v.ended && performance.now()-s0<cap){ await wait(50); }
        v.pause();
      }
      total=performance.now()-t0;
    }
    await wait(300);
  }finally{
    rec.stop(); await done;
    state.recording=false; state.zoom=1; state.cur=prevCur;
    state.media.forEach(m=>{ if(m.kind==='video'){ m.el.loop=true; m.el.muted=true; }});
    btns.forEach(b=>b.disabled=false); $('#videoBtn').textContent=L(isNative?'videoApp':'videoWeb');
    syncCurrent();
  }
  const type=rec.mimeType||mime||'video/webm';
  const blob=new Blob(chunks,{type:type.split(';')[0]});
  if(!blob.size){ toast(L('tVidFail')); return; }
  const ext=type.includes('mp4')?'mp4':'webm';
  const base=(state.product||state.shop.name||'اعلان').replace(/[\\/:*?"<>|]+/g,'').trim().slice(0,40)||'اعلان';
  const name=`${base}-${state.format==='story'?'ستوري':'بوست'}.${ext}`;
  if(await nativeShare(blob,name)) return;
  if(downloads){
    try{ await downloads.save({filename:name,data:blob}); toast(L('tVidSaved')); }
    catch(e){ if(e&&e.code==='declined') return; fallbackSave(blob,name); }
  } else fallbackSave(blob,name);
});
$('#copyBtn').addEventListener('click',async()=>{
  const text=$('#caption').value;
  try{ await navigator.clipboard.writeText(text); toast(L('tCopied')); }
  catch(_){ const ta=$('#caption'); ta.focus(); ta.select(); try{ document.execCommand('copy'); toast(L('tCopied')); }catch(__){ toast(L('tCopyMan')); } }
});

/* ---------- apply interface language ---------- */
function applyUI(){
  const de=document.documentElement; de.lang=UI; de.dir=UI==='ar'?'rtl':'ltr'; document.title=L('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=L(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder=L(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>{ el.setAttribute('aria-label',L(el.dataset.i18nAria)); });
  if(!state.recording){ $('#saveBtn').textContent=L(isNative?'saveApp':'saveWeb'); $('#videoBtn').textContent=L(isNative?'videoApp':'videoWeb'); }
  const lb=$('#uiLang'); lb.textContent=L('langBtn'); lb.setAttribute('aria-label',L('langAria'));
  makeAllChips(); renderGallery();
}
$('#uiLang').addEventListener('click',()=>{
  UI = UI==='ar'?'en':'ar';
  try{ localStorage.setItem('ilani-ui',UI); }catch(_){}
  applyUI();
});

/* ---------- start ---------- */
applyUI(); loadShop(); applyPresets(); render();
if(document.fonts){
  Promise.all([
    document.fonts.load(`800 80px Alexandria`),document.fonts.load(`700 40px Alexandria`),
    document.fonts.load(`500 40px "IBM Plex Sans Arabic"`),document.fonts.load(`700 40px "IBM Plex Sans Arabic"`)
  ]).then(render,render);
}
})();
</script>
